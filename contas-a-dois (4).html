<style>

  * { box-sizing: border-box; }
  body {
    margin: 0;

  .disp { font-family: 'Sora', sans-serif; }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(22,33,62,0.04); }
  .btn {
    font-family: 'Inter', sans-serif; font-weight: 600; border-radius: 10px;
    padding: 10px 16px; border: 1px solid transparent; cursor: pointer;

  .iconbtn { width: 32px; height: 32px; border-radius: 8px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--line); background:#fff; color: var(--ink-soft); flex-shrink:0; }

  .toast {

  .qrtab { padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; border:1px solid var(--line); background:#fff; color: var(--ink-soft); }
  .qrtab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* shell / sidebar */
  .shell { display: flex; min-height: 100vh; align-items: stretch; }
  .sidebar { width: 232px; flex-shrink: 0; background: var(--ink); color: #fff; display: flex; flex-direction: column; gap: 22px; padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { padding: 0 8px; }
  .brand .disp { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }

  .userpill { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.06); border: none; color: rgba(255,255,255,.68); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; width: 100%; text-align: left; }

/* ---------------------------------- dados fixos ---------------------------------- */

const CATEGORIES = [
  { id: 'moradia',      label: 'Moradia',      color: '#2D8577' },

  { id: 'salario',      label: 'Salário',            color: '#2D8577' },
  { id: 'extra',         label: 'Freelance/Extra',    color: '#D98E04' },

];

const GROQ_VISION_MODEL = 'qwen/qwen3.6-27b';

/* ---------------------------------- estado ---------------------------------- */

let state = {
  loading: true,
  firebaseError: false,
  firebaseErrorMsg: '',
  despesas: [],
  receitas: [],
  settings: { names: ['Fernanda', 'Marido'] },
  currentUser: 0,
  tab: 'painel',
  lancarSub: 'despesa',
  confirmDelete: null,
  mesAtual: new Date().toISOString().slice(0, 7),
};
let groqKey = '';
let filterDespStatus = 'todas', filterDespCat = 'todas', filterDespMes = 'todos';
let filterDespModo = 'mes', filterDespDe = '', filterDespAte = '';
let filterReceitaPessoa = 'todas', filterReceitaTipo = 'todas', filterReceitaMes = 'todos';
let filterReceitaModo = 'mes', filterReceitaDe = '', filterReceitaAte = '';
let mediaStream = null, scanRAF = null;

/* ---------------------------------- helpers ---------------------------------- */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayStr = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const formatCurrency = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const formatDate = (d) => { if (!d) return '—'; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const monthKey = (d) => (d ? d.slice(0, 7) : '');
const escapeHtml = (str) => String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const escapeAttr = (str) => String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const MESES_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MESES_ABR = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function monthLabelFull(key) { if (!key) return ''; const [y, m] = key.split('-'); return `${MESES_PT[Number(m) - 1]} de ${y}`; }
function monthLabelAbbrev(key) { if (!key) return ''; const [y, m] = key.split('-'); return `${MESES_ABR[Number(m) - 1]}/${y.slice(2)}`; }
function shiftMonth(key, delta) {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, '0')}`;
}
function distinctMonths(list, field) {
  const set = new Set(list.map(x => monthKey(x[field])).filter(Boolean));
  return Array.from(set).sort().reverse();
}

function mapCategoria(descricao) {
  if (!descricao) return 'outros';
  const s = descricao.toLowerCase();
  if (/restaurante|lanchonete|aliment|mercado|padaria|acougue|hortifruti|pizzaria|churrasc/.test(s)) return 'alimentacao';
  if (/farmac|hospital|clinica|laborat|saude|odont|drogaria/.test(s)) return 'saude';
  if (/combust|posto de|transporte|estacionamento|pedagio|oficina|automot|pneu/.test(s)) return 'transporte';
  if (/escola|curso|educacao|livraria|faculdade|ensino/.test(s)) return 'educacao';
  if (/cinema|streaming|lazer|jogos|turismo|hotel|parque|boliche/.test(s)) return 'lazer';
  if (/telefonia|internet|assinatura|tv por assinatura|software|provedor/.test(s)) return 'assinaturas';
  if (/vestuario|calcado|comercio varejista|magazine|eletro|moveis|papelaria/.test(s)) return 'compras';
  if (/imobiliaria|condominio|energia|agua e esgoto|construcao|material de construcao|aluguel/.test(s)) return 'moradia';
  return 'outros';
}

function extractChave(text) {
  if (!text) return null;
  const digitsOnly = text.replace(/\D/g, '');
  const matches = text.match(/\d[\d\s.-]{40,60}\d/g);
  if (matches) {
    for (const m of matches) {
      const d = m.replace(/\D/g, '');
      if (d.length === 44) return d;
    }
  }
  if (digitsOnly.length === 44) return digitsOnly;
  const m2 = digitsOnly.match(/\d{44}/);
  return m2 ? m2[0] : null;
}
function parseChave(chave) {
  const aamm = chave.slice(2, 6);
  const cnpj = chave.slice(6, 20);
  const numeroNF = chave.slice(25, 34).replace(/^0+/, '') || '0';
  const ano = '20' + aamm.slice(0, 2);
  const mes = aamm.slice(2, 4);
  return { cnpj, numeroNF, emissao: `${mes}/${ano}` };
}

/* ---------------------------------- storage (Firestore) ---------------------------------- */

async function saveDespesas() {
  try { await colRef.doc('despesas').set({ items: state.despesas }); }
  catch (e) { console.error('erro ao salvar despesas', e); state.firebaseError = true; render(); }
}
async function saveReceitas() {
  try { await colRef.doc('receitas').set({ items: state.receitas }); }
  catch (e) { console.error('erro ao salvar receitas', e); state.firebaseError = true; render(); }
}
async function saveSettings() {
  try { await colRef.doc('config').set(state.settings); }
  catch (e) { console.error('erro ao salvar configurações', e); state.firebaseError = true; render(); }
}

/* ---------------------------------- init ---------------------------------- */

async function init() {
  try { groqKey = localStorage.getItem('gastos_groq_key') || ''; } catch { groqKey = ''; }

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('COLOQUE_SUA_API_KEY') !== -1 || String(firebaseConfig.projectId).indexOf('SEU_PROJETO') !== -1) {
    state.loading = false;
    state.firebaseError = true;
    state.firebaseErrorMsg = 'Ainda falta trocar os valores de exemplo do firebaseConfig pelos dados reais do seu projeto no Firebase.';
    render();
    return;
  }

  const timeoutId = setTimeout(() => {
    if (state.loading) {
      state.loading = false;
      state.firebaseError = true;
      state.firebaseErrorMsg = state.firebaseErrorMsg || 'Demorou demais pra conectar no Firebase. Se você abriu o arquivo direto (duplo clique), rode por um servidor local ou publicado — o Firestore não funciona bem em file://.';
      render();
    }
  }, 9000);

  const got = { despesas: false, receitas: false, config: false };
  const markReady = () => { if (got.despesas && got.receitas && got.config) { clearTimeout(timeoutId); state.loading = false; render(); } };

  colRef.doc('despesas').onSnapshot(
    (doc) => { state.despesas = doc.exists ? (doc.data().items || []) : []; got.despesas = true; markReady(); if (!state.loading) render(); },
    (err) => { console.error(err); state.firebaseError = true; state.firebaseErrorMsg = (err && err.message) || String(err); got.despesas = true; markReady(); }
  );
  colRef.doc('receitas').onSnapshot(
    (doc) => { state.receitas = doc.exists ? (doc.data().items || []) : []; got.receitas = true; markReady(); if (!state.loading) render(); },
    (err) => { console.error(err); state.firebaseError = true; state.firebaseErrorMsg = (err && err.message) || String(err); got.receitas = true; markReady(); }
  );
  colRef.doc('config').onSnapshot(
    (doc) => { state.settings = doc.exists ? doc.data() : { names: ['Fernanda', 'Marido'] }; got.config = true; markReady(); if (!state.loading) render(); },
    (err) => { console.error(err); state.firebaseError = true; state.firebaseErrorMsg = (err && err.message) || String(err); got.config = true; markReady(); }
  );
}

/* ---------------------------------- cálculos ---------------------------------- */

function enrichDespesas() {
  const today = todayStr();
  return state.despesas.map((e) => {
    const diasVencido = !e.pago ? daysBetween(e.vencimento, today) : null;
    let status;
    if (e.pago) status = 'pago';
    else if (diasVencido > 0) status = 'vencido';
    else if (diasVencido >= -3) status = 'proximo';
    else status = 'pendente';
    return { ...e, diasVencido, status };
  });
}
function overdueList() { return enrichDespesas().filter(e => e.status === 'vencido').sort((a, b) => b.diasVencido - a.diasVencido); }
function dueSoonList() { return enrichDespesas().filter(e => e.status === 'proximo').sort((a, b) => a.diasVencido - b.diasVencido); }
function categoryChartData(mesKey) {
  const map = {};
  state.despesas.filter(e => !mesKey || monthKey(e.vencimento) === mesKey).forEach(e => { map[e.categoria] = (map[e.categoria] || 0) + Number(e.valor || 0); });
  return CATEGORIES.map(c => ({ label: c.label, value: map[c.id] || 0, color: c.color })).filter(c => c.value > 0);
}
function receitasDoMes(mesKey, name) {
  return state.receitas.filter(r => (!name || r.pessoa === name) && monthKey(r.data) === mesKey)
    .reduce((s, r) => s + Number(r.valor || 0), 0);
}
function despesasPagasDoMes(mesKey, name) {
  return state.despesas.filter(d => d.pago && (!name || d.lancadoPor === name) && monthKey(d.dataPagamento) === mesKey)
    .reduce((s, d) => s + Number(d.valor || 0), 0);
}
function trendMonths() {
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const mk = shiftMonth(state.mesAtual, -i);
    months.push({ key: mk, label: monthLabelAbbrev(mk), saldo: receitasDoMes(mk, null) - despesasPagasDoMes(mk, null) });
  }
  return months;
}

/* ---------------------------------- gráficos svg ---------------------------------- */

function svgBarChart(data) {
  const w = 560, barH = 24, gap = 10, leftW = 108, pad = 6;
  const maxV = Math.max(...data.map(d => d.value), 1);
  const h = data.length * (barH + gap) + gap;
  const bars = data.map((d, i) => {
    const y = gap + i * (barH + gap);
    const bw = Math.max(3, (d.value / maxV) * (w - leftW - 90));
    return `
      <text x="${pad}" y="${y + barH / 2 + 4}" font-size="12" font-family="Inter" fill="#5B6472">${escapeHtml(d.label)}</text>
      <rect x="${leftW}" y="${y}" width="${bw}" height="${barH}" rx="6" fill="${d.color}"></rect>
      <text x="${leftW + bw + 8}" y="${y + barH / 2 + 4}" font-size="12" font-family="IBM Plex Mono, monospace" fill="#16213E">${formatCurrency(d.value)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:100%;">${bars}</svg>`;
}

function svgTrendChart(months) {
  const w = 560, h = 150, padL = 8, padR = 8, padT = 16, padB = 24;
  const vals = months.map(m => m.saldo);
  const maxV = Math.max(...vals, 0), minV = Math.min(...vals, 0);
  const range = (maxV - minV) || 1;
  const stepX = (w - padL - padR) / ((months.length - 1) || 1);
  const points = months.map((m, i) => {
    const x = padL + i * stepX;
    const y = padT + (1 - (m.saldo - minV) / range) * (h - padT - padB);
    return { x, y };
  });
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaPath = path + ` L${points[points.length - 1].x.toFixed(1)},${h - padB} L${points[0].x.toFixed(1)},${h - padB} Z`;
  const zeroY = padT + (1 - (0 - minV) / range) * (h - padT - padB);
  const dots = points.map((p, i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.6" fill="${months[i].saldo >= 0 ? '#2D8577' : '#B0392F'}"></circle>`).join('');
  const labels = months.map((m, i) => `<text x="${points[i].x.toFixed(1)}" y="${h - 6}" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#5B6472" text-anchor="middle">${m.label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:100%;">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="#E7E2D6" stroke-width="1" stroke-dasharray="3,3"></line>
    <path d="${areaPath}" fill="#2D857718"></path>
    <path d="${path}" fill="none" stroke="#2D8577" stroke-width="2.2"></path>
    ${dots}${labels}
  </svg>`;
}

function navItem(id, iconName, label) {
  return `<button class="navitem ${state.tab === id ? 'active' : ''}" onclick="switchTab('${id}')">

function switchTab(id) { state.tab = id; render(); }
function switchUser(i) { state.currentUser = i; render(); }
function setLancarSub(s) { state.lancarSub = s; render(); }

const TAB_TITLES = { painel: 'Dashboard', lancar: 'Lançar', despesas: 'Despesas', receitas: 'Receitas' };
function buildTopBar() {
  const quickAdd = state.tab === 'despesas' ? `<button class="btn btn-primary" onclick="state.tab='lancar';state.lancarSub='despesa';render();">${icon('plus', 15)} Nova despesa</button>`
    : state.tab === 'receitas' ? `<button class="btn btn-teal" onclick="state.tab='lancar';state.lancarSub='receita';render();">${icon('plus', 15)} Nova receita</button>`

/* ---------------------------------- alertas ---------------------------------- */

function buildAlerts() {
  const overdue = overdueList(), dueSoon = dueSoonList();
  if (overdue.length === 0 && dueSoon.length === 0) return '';
  let html = `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">`;
  if (overdue.length > 0) {
    html += `<div class="card" style="background:var(--brick-soft);border-color:#E5C4C0;padding:12px 16px;display:flex;align-items:center;gap:10px;">
      <span style="color:var(--brick);">${icon('alert', 17)}</span>
      <span style="font-size:14px;color:var(--brick);font-weight:600;">${overdue.length} conta${overdue.length > 1 ? 's' : ''} vencida${overdue.length > 1 ? 's' : ''} — ${overdue.map(o => escapeHtml(o.descricao)).slice(0, 3).join(', ')}${overdue.length > 3 ? '…' : ''}</span>
    </div>`;
  }
  if (dueSoon.length > 0) {
    html += `<div class="card" style="background:var(--amber-soft);border-color:#EAD5A8;padding:12px 16px;display:flex;align-items:center;gap:10px;">
      <span style="color:var(--amber);">${icon('clock', 17)}</span>
      <span style="font-size:14px;color:var(--amber);font-weight:600;">${dueSoon.length} conta${dueSoon.length > 1 ? 's' : ''} vencendo nos próximos 3 dias</span>
    </div>`;
  }
  return html + `</div>`;
}

        <span style="font-size:12.5px;font-weight:600;color:var(--ink-soft);">${label}</span>
      </div>

}

function buildSummaryCards() {
  const enriched = enrichDespesas();
  const openTotal = enriched.filter(e => !e.pago).reduce((s, e) => s + Number(e.valor || 0), 0);
  const overdue = overdueList();
  const overdueTotal = overdue.reduce((s, e) => s + Number(e.valor || 0), 0);
  const paidThisMonth = enriched.filter(e => e.pago && monthKey(e.dataPagamento) === monthKey(todayStr())).reduce((s, e) => s + Number(e.valor || 0), 0);
  const receitasThisMonth = receitasDoMes(monthKey(todayStr()), null);
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;">
    ${statCard('Em aberto', openTotal, 'var(--ink)', 'wallet')}
    ${statCard('Vencido', overdueTotal, 'var(--brick)', 'alert', `${overdue.length} conta${overdue.length !== 1 ? 's' : ''}`)}
    ${statCard('Pago este mês', paidThisMonth, 'var(--teal)', 'check')}
    ${statCard('Receitas este mês', receitasThisMonth, 'var(--teal)', 'trending')}

}

  return `
    <div style="display:flex;align-items:center;gap:6px;">

      <div class="disp" style="font-weight:700;font-size:13.5px;min-width:130px;text-align:center;text-transform:capitalize;">${monthLabelFull(state.mesAtual)}</div>
      <button class="iconbtn" onclick="changeMes(1)" aria-label="Próximo mês">${icon('chevronRight', 15)}</button>
      ${state.mesAtual !== monthKey(todayStr()) ? `<button class="btn btn-ghost" style="padding:6px 10px;font-size:12px;" onclick="goToCurrentMonth()">hoje</button>` : ''}
    </div>
  `;
}
function changeMes(delta) { state.mesAtual = shiftMonth(state.mesAtual, delta); render(); }
function goToCurrentMonth() { state.mesAtual = monthKey(todayStr()); render(); }

function resumoCard(title, receitas, despesas, accentColor, extraHtml) {
  const saldo = receitas - despesas;
  return `
   <div class="card" style="padding:16px 18px;border-left:3px solid ${accentColor};">
     <div style="font-weight:700;font-size:14px;margin-bottom:10px;">${escapeHtml(title)}</div>
     <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);"><span>Receitas do mês</span><span class="num" style="color:var(--teal);font-weight:600;">+${formatCurrency(receitas)}</span></div>
     <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:4px;"><span>Despesas pagas</span><span class="num" style="color:var(--brick);font-weight:600;">-${formatCurrency(despesas)}</span></div>
     <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;">

function receitasOrigemList(mesKey, name) {

}
function buildResumoSection() {

                </div>
                <div style="text-align:right;">
                  <div class="num" style="font-weight:600;">${formatCurrency(e.valor)}</div>
                  ${e.status === 'vencido' ? `<span class="pill pill-vencido">${e.diasVencido}d vencido</span>` : `<span class="pill pill-proximo">vence em ${Math.max(0, -e.diasVencido)}d</span>`}
                </div>

            `).join('')}

      ` : `<div class="card" style="padding:18px 20px;text-align:center;color:var(--ink-soft);">Tudo em dia — nenhuma conta vencida ou vencendo nos próximos dias. 🎉</div>`}

        <button class="qrtab ${state.lancarSub === 'despesa' ? 'active' : ''}" onclick="setLancarSub('despesa')">Despesa</button>

function buildFormDespesa() {

async function submitDespesa() {
  const descricao = document.getElementById('descDespesa').value.trim();
  const valor = Number(document.getElementById('valorDespesa').value);
  const vencimento = document.getElementById('vencDespesa').value;
  const categoria = document.getElementById('catDespesa').value;
  const observacao = document.getElementById('obsDespesa').value.trim();
  const pago = document.getElementById('pagoDespesa').checked;
  if (!descricao || !valor || !vencimento) { showToast('Preencha descrição, valor e vencimento.'); return; }
  const item = {
    id: uid(), descricao, valor, categoria, vencimento, observacao,
    pago, dataPagamento: pago ? todayStr() : null,
    lancadoPor: state.settings.names[state.currentUser], criadoEm: new Date().toISOString(),
  };
  state.despesas = [item, ...state.despesas];
  await saveDespesas();
  showToast('Despesa lançada.');
  render();
}

function buildFormReceita() {
  const typeOptions = INCOME_TYPES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  const peopleOptions = state.settings.names.map((n, i) => `<option value="${escapeAttr(n)}" ${i === state.currentUser ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');
  return `
    <div style="display:flex;flex-direction:column;gap:14px;">

async function submitReceita() {
  const descricao = document.getElementById('descReceita').value.trim();
  const valor = Number(document.getElementById('valorReceita').value);
  const data = document.getElementById('dataReceita').value;
  const pessoa = document.getElementById('pessoaReceita').value;
  const tipo = document.getElementById('tipoReceita').value;
  const origem = document.getElementById('origemReceita').value.trim();
  if (!descricao || !valor || !data) { showToast('Preencha descrição, valor e data.'); return; }
  const item = { id: uid(), descricao, valor, data, pessoa, tipo, origem, criadoEm: new Date().toISOString() };

/* ---------------------------------- lista de despesas ---------------------------------- */

function groupByMonth(list, field, rowFn) {
  let html = ''; let lastMonth = null;
  list.forEach(item => {
    const mk = monthKey(item[field]);
    if (mk !== lastMonth) {
      html += `<div class="disp" style="font-weight:700;font-size:13px;color:var(--ink-soft);text-transform:capitalize;">${monthLabelFull(mk)}</div>`;
      lastMonth = mk;
    }
    html += rowFn(item);
  });
  return html;
}

function periodToggle(modo, onMes, onPeriodo) {
  return `<div style="display:flex;gap:4px;">
    <button class="qrtab ${modo === 'mes' ? 'active' : ''}" onclick="${onMes}">Mês</button>
    <button class="qrtab ${modo === 'periodo' ? 'active' : ''}" onclick="${onPeriodo}">Período</button>
  </div>`;
}

function buildDespesasList() {
  const list = enrichDespesas().filter(e => {
    if (filterDespStatus === 'pendentes' && e.pago) return false;
    if (filterDespStatus === 'pagas' && !e.pago) return false;
    if (filterDespStatus === 'vencidas' && e.status !== 'vencido') return false;
    if (filterDespCat !== 'todas' && e.categoria !== filterDespCat) return false;
    if (filterDespModo === 'mes') {
      if (filterDespMes !== 'todos' && monthKey(e.vencimento) !== filterDespMes) return false;
    } else {
      if (filterDespDe && e.vencimento < filterDespDe) return false;
      if (filterDespAte && e.vencimento > filterDespAte) return false;
    }
    return true;
  }).sort((a, b) => (a.vencimento < b.vencimento ? 1 : -1));

  const filterBtns = ['todas', 'pendentes', 'pagas', 'vencidas'].map(f => `
    <button class="qrtab ${filterDespStatus === f ? 'active' : ''}" onclick="setFilterDespStatus('${f}')">${f[0].toUpperCase() + f.slice(1)}</button>`).join('');
  const catOptions = `<option value="todas">Todas categorias</option>` + CATEGORIES.map(c => `<option value="${c.id}" ${filterDespCat === c.id ? 'selected' : ''}>${c.label}</option>`).join('');
  const meses = distinctMonths(state.despesas, 'vencimento');
  const mesOptions = `<option value="todos">Todos os meses</option>` + meses.map(m => `<option value="${m}" ${filterDespMes === m ? 'selected' : ''}>${monthLabelFull(m)}</option>`).join('');

  const periodoBlock = filterDespModo === 'periodo'
    ? `<input class="input" type="date" style="width:auto;font-size:12.5px;padding:7px 10px;" value="${filterDespDe}" onchange="setFilterDespDe(this.value)">
       <input class="input" type="date" style="width:auto;font-size:12.5px;padding:7px 10px;" value="${filterDespAte}" onchange="setFilterDespAte(this.value)">`
    : `<select class="input" style="width:auto;font-size:12.5px;padding:7px 10px;" onchange="setFilterDespMes(this.value)">${mesOptions}</select>`;

  const rows = list.length === 0
    ? `<div class="card" style="padding:30px;text-align:center;color:var(--ink-soft);">Nenhuma conta nesse filtro.</div>`
    : groupByMonth(list, 'vencimento', despesaRow);

  return `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;">
      ${filterBtns}
      <select class="input" style="width:auto;font-size:12.5px;padding:7px 10px;" onchange="setFilterDespCat(this.value)">${catOptions}</select>
      ${periodToggle(filterDespModo, "setFilterDespModo('mes')", "setFilterDespModo('periodo')")}
      ${periodoBlock}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">${rows}</div>
  `;
}
function setFilterDespStatus(f) { filterDespStatus = f; render(); }
function setFilterDespCat(c) { filterDespCat = c; render(); }
function setFilterDespMes(m) { filterDespMes = m; render(); }
function setFilterDespModo(m) { filterDespModo = m; render(); }
function setFilterDespDe(v) { filterDespDe = v; render(); }
function setFilterDespAte(v) { filterDespAte = v; render(); }

  qrCurrentMode = mode;
  stopCamera();
  document.querySelectorAll('#qrTabs .qrtab').forEach(t => t.classList.toggle('active', t.dataset.qrmode === mode));
  const body = document.getElementById('qrModeBody');
  document.getElementById('qrResultBody').innerHTML = '';
  if (mode === 'foto') {
    body.innerHTML = `
      ${!groqKey ? `<p style="font-size:13px;color:var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:8px;margin-bottom:10px;">Configure sua chave da Groq em Configurações para ler a nota inteira com IA (inclusive o valor). <button class="btn btn-ghost" style="padding:4px 8px;font-size:12px;" onclick="closeQRModal();openSettingsModal();">Configurar agora</button></p>` : ''}
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="startCamera('foto')">${icon('camera', 15)} Usar câmera</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="document.getElementById('qrFileInput').click()">${icon('upload', 15)} Enviar foto</button>
      </div>
      <input type="file" id="qrFileInput" accept="image/*" style="display:none" onchange="handleQRFile(event,'foto')">
      <div id="qrCameraArea" style="margin-top:10px;"></div>
    `;
  } else if (mode === 'qr') {
    body.innerHTML = `
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="startCamera('qr')">${icon('camera', 15)} Usar câmera</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="document.getElementById('qrFileInput2').click()">${icon('upload', 15)} Enviar imagem</button>
      </div>
      <input type="file" id="qrFileInput2" accept="image/*" style="display:none" onchange="handleQRFile(event,'qr')">
      <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Sem IA: identifica o estabelecimento pela chave de acesso, mas não traz o valor.</p>
      <div id="qrCameraArea" style="margin-top:10px;"></div>
    `;
  } else {
    body.innerHTML = `
      <label class="label">Cole aqui o link/texto do QR Code (ou a chave de acesso de 44 números)</label>
      <textarea class="input" id="qrPasteText" rows="3" placeholder="https://www.fazenda.sp.gov.br/nfce/qrcode?p=..."></textarea>
      <button class="btn btn-primary" style="margin-top:10px;width:100%;justify-content:center;" onclick="processQRText(document.getElementById('qrPasteText').value)">Buscar dados</button>
    `;
  }
}
function stopCamera() {
  if (scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}
async function startCamera(mode) {
  const area = document.getElementById('qrCameraArea');
  if (!area) return;
  area.innerHTML = `<video id="qrVideo" autoplay muted playsinline style="width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover;"></video><div id="qrCamMsg" style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;"></div>`;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('qrVideo');
    video.srcObject = mediaStream;
    await video.play();
    if (mode === 'foto') {
      document.getElementById('qrCamMsg').innerHTML = `<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" onclick="captureFotoFrame()">Tirar foto e analisar</button>`;
    } else {
      document.getElementById('qrCamMsg').textContent = 'Aponte a câmera para o QR Code da nota…';
      scanQRLoop();
    }
  } catch (e) {
    area.innerHTML = `<p style="font-size:13px;color:var(--brick);">Não consegui acessar a câmera. Use "Enviar imagem"/"Enviar foto" no lugar.</p>`;
  }
}
function captureFotoFrame() {
  const video = document.getElementById('qrVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  stopCamera();
  processFotoDataUrl(canvas.toDataURL('image/jpeg', 0.85));
}
async function scanQRLoop() {
  if (!('BarcodeDetector' in window)) {
    document.getElementById('qrCamMsg').innerHTML = 'Este navegador não suporta leitura automática de QR. Use "Colar texto".';
    stopCamera();
    return;
  }
  const video = document.getElementById('qrVideo');
  const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
  const loop = async () => {
    if (!mediaStream || !video) return;
    try {
      const codes = await detector.detect(video);
      if (codes.length > 0) { stopCamera(); processQRText(codes[0].rawValue); return; }
    } catch (e) {}
    scanRAF = requestAnimationFrame(loop);
  };
  scanRAF = requestAnimationFrame(loop);
}
function handleQRFile(evt, mode) {
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    if (mode === 'foto') { processFotoDataUrl(dataUrl); return; }
    if (!('BarcodeDetector' in window)) {
      document.getElementById('qrResultBody').innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Este navegador não lê QR de imagem automaticamente. Use "Colar texto".</p>`;
      return;
    }
    try {
      const bitmap = await createImageBitmap(file);
      const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
      const codes = await detector.detect(bitmap);
      if (codes.length > 0) processQRText(codes[0].rawValue);
      else document.getElementById('qrResultBody').innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Não achei um QR Code nessa imagem.</p>`;
    } catch (e) {
      document.getElementById('qrResultBody').innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Não consegui ler essa imagem.</p>`;
    }
  };
  reader.readAsDataURL(file);
}
async function callGroqVision(dataUrl) {
  if (!groqKey) return { error: 'no-key' };
  try {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + groqKey },
      body: JSON.stringify({
        model: GROQ_VISION_MODEL,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: 'Você está lendo uma nota fiscal, cupom fiscal ou recibo brasileiro. Responda APENAS um JSON válido, sem texto antes ou depois, no formato: {"fornecedor": "nome do estabelecimento ou null", "valor": numero_total_ou_null, "data": "AAAA-MM-DD ou null", "categoria": "uma dessas: moradia, alimentacao, transporte, saude, educacao, lazer, assinaturas, compras, outros", "ramo": "ramo de atividade em poucas palavras ou null"}. O campo valor deve ser o valor TOTAL da nota, em número com ponto decimal, sem símbolo de moeda.' },
            { type: 'image_url', image_url: { url: dataUrl } }
          ]
        }],
        temperature: 0.1,
        max_completion_tokens: 500,
        response_format: { type: 'json_object' }
      })
    });
    if (!resp.ok) { const txt = await resp.text(); return { error: 'http', detail: txt }; }
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '{}';
    return { ok: true, data: JSON.parse(content) };
  } catch (e) { return { error: 'network', detail: String(e) }; }
}
async function processFotoDataUrl(dataUrl) {
  const resBody = document.getElementById('qrResultBody');
  resBody.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink-soft);font-size:13.5px;">⏳ Lendo a nota com IA…</div>`;
  const result = await callGroqVision(dataUrl);
  if (result.error === 'no-key') { resBody.innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Configure sua chave da Groq em Configurações primeiro.</p>`; return; }
  if (result.error) { resBody.innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Não consegui falar com a IA da Groq agora (${escapeHtml(String(result.detail || '').slice(0, 140))}). Tente de novo ou use "QR Code"/"Colar texto".</p>`; return; }
  const d = result.data || {};
  const categoria = CATEGORY_MAP[d.categoria] ? d.categoria : mapCategoria(d.ramo || '');
  showQRResult({ fornecedor: d.fornecedor || '', valor: (d.valor !== undefined && d.valor !== null) ? Number(d.valor) : null, data: d.data || null, categoria, ramo: d.ramo || '', info: `Lido por IA${d.ramo ? ' · ' + d.ramo : ''}` });
}
async function processQRText(text) {
  const resBody = document.getElementById('qrResultBody');
  const chave = extractChave(text);
  if (!chave) { resBody.innerHTML = `<p style="font-size:13.5px;color:var(--brick);margin-top:14px;">Não encontrei uma chave de acesso válida nesse conteúdo. Tente colar o link completo que fica embaixo do QR.</p>`; return; }
  const { cnpj, numeroNF, emissao } = parseChave(chave);
  resBody.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink-soft);font-size:13.5px;">⏳ Identificando o estabelecimento…</div>`;
  let fornecedor = '', ramo = '';
  try {
    const resp = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
    if (resp.ok) { const data = await resp.json(); fornecedor = data.nome_fantasia || data.razao_social || ''; ramo = data.cnae_fiscal_descricao || ''; }
  } catch (e) {}
  const categoria = mapCategoria(ramo);
  showQRResult({ fornecedor, valor: null, data: null, categoria, ramo, info: `Nota ${numeroNF} · ${emissao}${ramo ? ' · ' + ramo : ''}` });
}
function showQRResult(r) {
  window.__qrPrefillCandidate = r;
  const resBody = document.getElementById('qrResultBody');
  const cat = CATEGORY_MAP[r.categoria] || CATEGORY_MAP.outros;
  resBody.innerHTML = `
    <div class="card" style="padding:14px;margin-top:14px;background:var(--bg);">
      ${r.fornecedor ? `<div style="font-weight:700;font-size:15px;">${escapeHtml(r.fornecedor)}</div>` : `<p style="font-size:13.5px;color:var(--ink-soft);">Não identifiquei o estabelecimento automaticamente — dá pra preencher na mão.</p>`}
      ${r.ramo ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">${escapeHtml(r.ramo)}</div>` : ''}
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
        <span class="pill" style="background:${cat.color}22;color:${cat.color};">sugestão: ${cat.label}</span>
        ${r.valor != null ? `<span class="pill pill-pago">valor lido: ${formatCurrency(r.valor)}</span>` : ''}
        ${r.data ? `<span class="pill pill-pendente">${formatDate(r.data)}</span>` : ''}
      </div>
      ${r.valor == null ? `<p style="font-size:12px;color:var(--ink-soft);margin-top:10px;">Esse método não traz o valor da compra — preencha na próxima tela. (Use "Foto (IA)" pra tentar puxar o valor também.)</p>` : ''}
      <button class="btn btn-primary" style="margin-top:10px;width:100%;justify-content:center;" onclick="usePrefillFromQR()">Usar estes dados no lançamento ${icon('chevronRight', 14)}</button>
    </div>
  `;
}
function usePrefillFromQR() {
  const r = window.__qrPrefillCandidate;
  closeQRModal();
  state.tab = 'lancar'; state.lancarSub = 'despesa';
  render();
  setTimeout(() => {
    const descEl = document.getElementById('descDespesa');
    const catEl = document.getElementById('catDespesa');
    const valorEl = document.getElementById('valorDespesa');
    const obsEl = document.getElementById('obsDespesa');
    const vencEl = document.getElementById('vencDespesa');
    const pagoEl = document.getElementById('pagoDespesa');
    if (descEl) descEl.value = r.fornecedor || '';
    if (catEl) catEl.value = r.categoria || 'outros';
    if (obsEl) obsEl.value = r.info || '';
    if (r.valor != null && valorEl) valorEl.value = r.valor;
    if (r.data && vencEl) vencEl.value = r.data;
    if (r.data && pagoEl) pagoEl.checked = true;
    if (valorEl) valorEl.focus();
  }, 30);
}

/* ---------------------------------- start ---------------------------------- */

init();
</script>
