<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas a Dois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4EE;
    --surface: #FFFFFF;
    --ink: #16213E;
    --ink-soft: #5B6472;
    --line: #E7E2D6;
    --teal: #2D8577;
    --teal-soft: #E3F0EC;
    --amber: #B7790A;
    --amber-soft: #FBEEDA;
    --brick: #B0392F;
    --brick-soft: #F8E4E1;
    --slate: #7A8B99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .disp { font-family: 'Sora', sans-serif; }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .btn {
    font-family: 'Inter', sans-serif; font-weight: 600; border-radius: 10px;
    padding: 10px 16px; border: 1px solid transparent; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-teal { background: var(--teal); color: #fff; }
  .btn-teal:hover { opacity: .9; }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: #00000006; }
  .input {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-family: 'Inter', sans-serif; font-size: 14px; background: #fff; color: var(--ink);
  }
  .input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; display: block; }
  .tab-btn {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13.5px; padding: 9px 14px;
    border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
  }
  .tab-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill {
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace;
  }
  .pill-vencido { background: var(--brick-soft); color: var(--brick); }
  .pill-proximo { background: var(--amber-soft); color: var(--amber); }
  .pill-pago { background: var(--teal-soft); color: var(--teal); }
  .pill-pendente { background: #EEF0F2; color: var(--slate); }
  .checkbox {
    width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    color: #fff; font-size: 13px;
  }
  .checkbox.checked { background: var(--teal); border-color: var(--teal); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(22,33,62,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal-box { background: #fff; border-radius: 16px; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600; z-index: 60; display: none;
  }
  .qrtab { flex: 1; text-align: center; padding: 9px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .qrtab.active { background: var(--ink); color: #fff; }
  .qrtab:not(.active) { background: #EEF0F2; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="app" class="wrap"><p style="color:var(--ink-soft);">Carregando as contas de vocês…</p></div>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
/* ---------------------------------- firebase ----------------------------------
   Troque os valores abaixo pelos do SEU projeto (Configurações do projeto > Geral
   > Seus apps > Config, no Console do Firebase). */
const firebaseConfig = {
  apiKey: "AIzaSyDwcFUPJu5grQWR11UqyYzoyx3DfnLRSPA",
  authDomain: "contascasa-4b81a.firebaseapp.com",
  projectId: "contascasa-4b81a",
  storageBucket: "contascasa-4b81a.firebasestorage.app",
  messagingSenderId: "718647705359",
  appId: "1:718647705359:web:29ea41f1a61b57c42d487a",
  measurementId: "G-QBH66E05NT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const colRef = db.collection('contas_a_dois');

/* ---------------------------------- dados fixos ---------------------------------- */

const CATEGORIES = [
  { id: 'moradia',      label: 'Moradia',      color: '#2D8577' },
  { id: 'alimentacao',  label: 'Alimentação',  color: '#D98E04' },
  { id: 'transporte',   label: 'Transporte',   color: '#6C5B7B' },
  { id: 'saude',        label: 'Saúde',        color: '#C1443C' },
  { id: 'educacao',     label: 'Educação',     color: '#3A6EA5' },
  { id: 'lazer',        label: 'Lazer',        color: '#8FA31E' },
  { id: 'assinaturas',  label: 'Assinaturas',  color: '#B5651D' },
  { id: 'compras',      label: 'Compras',      color: '#7A8B99' },
  { id: 'outros',       label: 'Outros',       color: '#9C9282' },
];
const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

const INCOME_TYPES = [
  { id: 'salario',      label: 'Salário',            color: '#2D8577' },
  { id: 'extra',         label: 'Freelance/Extra',    color: '#D98E04' },
  { id: 'investimento',  label: 'Investimento',       color: '#3A6EA5' },
  { id: 'reembolso',     label: 'Reembolso',          color: '#6C5B7B' },
  { id: 'presente',      label: 'Presente',           color: '#8FA31E' },
  { id: 'outros',        label: 'Outros',             color: '#9C9282' },
];
const INCOME_TYPE_MAP = Object.fromEntries(INCOME_TYPES.map(c => [c.id, c]));

const GROQ_VISION_MODEL = 'qwen/qwen3.6-27b';

/* ---------------------------------- estado ---------------------------------- */

let state = {
  loading: true,
  firebaseError: false,
  firebaseErrorMsg: '',
  despesas: [],
  receitas: [],
  settings: { names: ['Fernanda', 'Marido'] },
  currentUser: 0,
  tab: 'painel',
  lancarSub: 'despesa',
  confirmDelete: null,
  mesAtual: new Date().toISOString().slice(0, 7),
};
let groqKey = '';
let filterDespStatus = 'todas', filterDespCat = 'todas', filterDespMes = 'todos';
let filterReceitaPessoa = 'todas', filterReceitaTipo = 'todas', filterReceitaMes = 'todos';
let mediaStream = null, scanRAF = null;

/* ---------------------------------- helpers ---------------------------------- */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayStr = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const formatCurrency = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const formatDate = (d) => { if (!d) return '—'; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const monthKey = (d) => (d ? d.slice(0, 7) : '');
const MESES_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function monthLabelFull(key) { if (!key) return ''; const [y, m] = key.split('-'); return `${MESES_PT[Number(m) - 1]} de ${y}`; }
function shiftMonth(key, delta) {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, '0')}`;
}
function distinctMonths(list, field) {
  const set = new Set(list.map(x => monthKey(x[field])).filter(Boolean));
  return Array.from(set).sort().reverse();
}
const escapeHtml = (str) => String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const escapeAttr = (str) => String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function mapCategoria(descricao) {
  if (!descricao) return 'outros';
  const s = descricao.toLowerCase();
  if (/restaurante|lanchonete|aliment|mercado|padaria|acougue|hortifruti|pizzaria|churrasc/.test(s)) return 'alimentacao';
  if (/farmac|hospital|clinica|laborat|saude|odont|drogaria/.test(s)) return 'saude';
  if (/combust|posto de|transporte|estacionamento|pedagio|oficina|automot|pneu/.test(s)) return 'transporte';
  if (/escola|curso|educacao|livraria|faculdade|ensino/.test(s)) return 'educacao';
  if (/cinema|streaming|lazer|jogos|turismo|hotel|parque|boliche/.test(s)) return 'lazer';
  if (/telefonia|internet|assinatura|tv por assinatura|software|provedor/.test(s)) return 'assinaturas';
  if (/vestuario|calcado|comercio varejista|magazine|eletro|moveis|papelaria/.test(s)) return 'compras';
  if (/imobiliaria|condominio|energia|agua e esgoto|construcao|material de construcao|aluguel/.test(s)) return 'moradia';
  return 'outros';
}

function extractChave(text) {
  if (!text) return null;
  const digitsOnly = text.replace(/\D/g, '');
  const matches = text.match(/\d[\d\s.-]{40,60}\d/g);
  if (matches) {
    for (const m of matches) {
      const d = m.replace(/\D/g, '');
      if (d.length === 44) return d;
    }
  }
  if (digitsOnly.length === 44) return digitsOnly;
  const m2 = digitsOnly.match(/\d{44}/);
  return m2 ? m2[0] : null;
}

function parseChave(chave) {
  const aamm = chave.slice(2, 6);
  const cnpj = chave.slice(6, 20);
  const numeroNF = chave.slice(25, 34).replace(/^0+/, '') || '0';
  const ano = '20' + aamm.slice(0, 2);
  const mes = aamm.slice(2, 4);
  return { cnpj, numeroNF, emissao: `${mes}/${ano}` };
}

/* ---------------------------------- storage (Firestore) ---------------------------------- */

async function saveDespesas() {
  try { await colRef.doc('despesas').set({ items: state.despesas }); }
  catch (e) { console.error('erro ao salvar despesas', e); state.firebaseError = true; render(); }
}
async function saveReceitas() {
  try { await colRef.doc('receitas').set({ items: state.receitas }); }
  catch (e) { console.error('erro ao salvar receitas', e); state.firebaseError = true; render(); }
}
async function saveSettings() {
  try { await colRef.doc('config').set(state.settings); }
  catch (e) { console.error('erro ao salvar configurações', e); state.firebaseError = true; render(); }
}

/* ---------------------------------- init ---------------------------------- */

async function init() {
  // a chave da Groq é só deste navegador/pessoa, não vai para o Firestore
  try { groqKey = localStorage.getItem('gastos_groq_key') || ''; } catch { groqKey = ''; }

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('COLOQUE_SUA_API_KEY') !== -1 || String(firebaseConfig.projectId).indexOf('SEU_PROJETO') !== -1) {
    state.loading = false;
    state.firebaseError = true;
    state.firebaseErrorMsg = 'Ainda falta trocar os valores de exemplo do firebaseConfig (lá no topo do arquivo) pelos dados reais do seu projeto no Firebase.';
    render();
    return;
  }

  const timeoutId = setTimeout(() => {
    if (state.loading) {
      state.loading = false;
      state.firebaseError = true;
      state.firebaseErrorMsg = state.firebaseErrorMsg || 'Demorou demais pra conectar no Firebase. Se você abriu o arquivo direto (duplo clique), tente rodar por um servidor local ou publicado (Vercel etc) — o Firestore não funciona bem em file://.';
      render();
    }
  }, 9000);

  const got = { despesas: false, receitas: false, config: false };
  const markReady = () => { if (got.despesas && got.receitas && got.config) { clearTimeout(timeoutId); state.loading = false; render(); } };

  colRef.doc('despesas').onSnapshot(
    (doc) => { state.despesas = doc.exists ? (doc.data().items || []) : []; got.despesas = true; markReady(); if (!state.loading) render(); },
    (err) => { console.error(err); state.firebaseError = true; state.firebaseErrorMsg = (err && err.message) || String(err); got.despesas = true; markReady(); }
  );
  colRef.doc('receitas').onSnapshot(
    (doc) => { state.receitas = doc.exists ? (doc.data().items || []) : []; got.receitas = true; markReady(); if (!state.loading) render(); },
    (err) => { console.error(err); state.firebaseError = true; state.firebaseErrorMsg = (err && err.message) || String(err); got.receitas = true; markReady(); }
  );
  colRef.doc('config').onSnapshot(
    (doc) => { state.settings = doc.exists ? doc.data() : { names: ['Fernanda', 'Marido'] }; got.config = true; markReady(); if (!state.loading) render(); },
    (err) => { console.error(err); state.firebaseError = true; state.firebaseErrorMsg = (err && err.message) || String(err); got.config = true; markReady(); }
  );
}

/* ---------------------------------- cálculos ---------------------------------- */

function enrichDespesas() {
  const today = todayStr();
  return state.despesas.map((e) => {
    const diasVencido = !e.pago ? daysBetween(e.vencimento, today) : null;
    let status;
    if (e.pago) status = 'pago';
    else if (diasVencido > 0) status = 'vencido';
    else if (diasVencido >= -3) status = 'proximo';
    else status = 'pendente';
    return { ...e, diasVencido, status };
  });
}
function overdueList() { return enrichDespesas().filter(e => e.status === 'vencido').sort((a, b) => b.diasVencido - a.diasVencido); }
function dueSoonList() { return enrichDespesas().filter(e => e.status === 'proximo').sort((a, b) => a.diasVencido - b.diasVencido); }
function categoryChartData(mesKey) {
  const map = {};
  state.despesas.filter(e => !mesKey || monthKey(e.vencimento) === mesKey).forEach(e => { map[e.categoria] = (map[e.categoria] || 0) + Number(e.valor || 0); });
  return CATEGORIES.map(c => ({ label: c.label, value: map[c.id] || 0, color: c.color })).filter(c => c.value > 0);
}
function receitasDoMes(mesKey, name) {
  return state.receitas.filter(r => (!name || r.pessoa === name) && monthKey(r.data) === mesKey)
    .reduce((s, r) => s + Number(r.valor || 0), 0);
}
function despesasPagasDoMes(mesKey, name) {
  return state.despesas.filter(d => d.pago && (!name || d.lancadoPor === name) && monthKey(d.dataPagamento) === mesKey)
    .reduce((s, d) => s + Number(d.valor || 0), 0);
}

/* ---------------------------------- gráfico svg simples ---------------------------------- */

function svgBarChart(data) {
  const w = 560, barH = 24, gap = 10, leftW = 110, pad = 6;
  const maxV = Math.max(...data.map(d => d.value), 1);
  const h = data.length * (barH + gap) + gap;
  const bars = data.map((d, i) => {
    const y = gap + i * (barH + gap);
    const bw = Math.max(3, (d.value / maxV) * (w - leftW - 90));
    return `
      <text x="${pad}" y="${y + barH / 2 + 4}" font-size="12" font-family="Inter" fill="#5B6472">${escapeHtml(d.label)}</text>
      <rect x="${leftW}" y="${y}" width="${bw}" height="${barH}" rx="5" fill="${d.color}"></rect>
      <text x="${leftW + bw + 8}" y="${y + barH / 2 + 4}" font-size="12" font-family="IBM Plex Mono, monospace" fill="#16213E">${formatCurrency(d.value)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:100%;">${bars}</svg>`;
}

/* ---------------------------------- render principal ---------------------------------- */

function render() {
  document.getElementById('app').innerHTML = buildAppHTML();
}

function buildAppHTML() {
  if (state.loading) return `<p style="color:var(--ink-soft);">Carregando as contas de vocês…</p>`;
  return `
    ${state.firebaseError ? `<div class="card" style="background:var(--brick-soft);border-color:#E5C4C0;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--brick);">
      <div style="font-weight:700;margin-bottom:4px;">Não consegui conectar no Firebase</div>
      <div>${escapeHtml(state.firebaseErrorMsg || 'Confira o firebaseConfig no início do arquivo e as regras do Firestore.')}</div>
      <button class="btn btn-ghost" style="margin-top:8px;padding:6px 10px;font-size:12px;" onclick="location.reload()">Tentar de novo</button>
    </div>` : ''}
    ${buildHeader()}
    ${buildAlerts()}
    ${buildSummaryCards()}
    <div style="display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap;">
      ${tabBtn('painel', 'Visão geral')}
      ${tabBtn('lancar', 'Lançar')}
      ${tabBtn('despesas', 'Despesas (' + state.despesas.length + ')')}
      ${tabBtn('receitas', 'Receitas (' + state.receitas.length + ')')}
    </div>
    <div id="tabContent">${buildTabContent()}</div>
  `;
}
function tabBtn(id, label) {
  return `<button class="tab-btn ${state.tab === id ? 'active' : ''}" onclick="switchTab('${id}')">${label}</button>`;
}
function switchTab(id) { state.tab = id; render(); }
function switchUser(i) { state.currentUser = i; render(); }
function setLancarSub(s) { state.lancarSub = s; render(); }

function buildTabContent() {
  if (state.tab === 'painel') return buildPainel();
  if (state.tab === 'lancar') return buildLancar();
  if (state.tab === 'despesas') return buildDespesasList();
  if (state.tab === 'receitas') return buildReceitasList();
  return '';
}

/* ---------------------------------- header / alertas / resumo topo ---------------------------------- */

function buildHeader() {
  return `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 class="disp" style="font-size:26px;font-weight:800;margin:0;letter-spacing:-0.02em;">Contas a dois</h1>
      <p style="margin:4px 0 0;color:var(--ink-soft);font-size:14px;">Despesas, receitas e quem tá com o quê em dia.</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="card" style="display:flex;padding:4px;gap:4px;">
        ${state.settings.names.map((n, i) => `
          <button class="btn" style="padding:7px 12px;font-size:13px;background:${state.currentUser === i ? 'var(--ink)' : 'transparent'};color:${state.currentUser === i ? '#fff' : 'var(--ink-soft)'};" onclick="switchUser(${i})">${escapeHtml(n)}</button>
        `).join('')}
      </div>
      <button class="btn btn-ghost" style="padding:10px;" onclick="openSettingsModal()" aria-label="Configurações">⚙</button>
    </div>
  </div>`;
}

function buildAlerts() {
  const overdue = overdueList(), dueSoon = dueSoonList();
  if (overdue.length === 0 && dueSoon.length === 0) return '';
  let html = `<div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;">`;
  if (overdue.length > 0) {
    html += `<div class="card" style="background:var(--brick-soft);border-color:#E5C4C0;padding:12px 16px;display:flex;align-items:center;gap:10px;">
      <span>⚠</span>
      <span style="font-size:14px;color:var(--brick);font-weight:600;">${overdue.length} conta${overdue.length > 1 ? 's' : ''} vencida${overdue.length > 1 ? 's' : ''} — ${overdue.map(o => escapeHtml(o.descricao)).slice(0, 3).join(', ')}${overdue.length > 3 ? '…' : ''}</span>
    </div>`;
  }
  if (dueSoon.length > 0) {
    html += `<div class="card" style="background:var(--amber-soft);border-color:#EAD5A8;padding:12px 16px;display:flex;align-items:center;gap:10px;">
      <span>⏰</span>
      <span style="font-size:14px;color:var(--amber);font-weight:600;">${dueSoon.length} conta${dueSoon.length > 1 ? 's' : ''} vencendo nos próximos 3 dias</span>
    </div>`;
  }
  return html + `</div>`;
}

function buildSummaryCards() {
  const enriched = enrichDespesas();
  const openTotal = enriched.filter(e => !e.pago).reduce((s, e) => s + Number(e.valor || 0), 0);
  const overdue = overdueList();
  const overdueTotal = overdue.reduce((s, e) => s + Number(e.valor || 0), 0);
  const paidThisMonth = enriched.filter(e => e.pago && monthKey(e.dataPagamento) === monthKey(todayStr())).reduce((s, e) => s + Number(e.valor || 0), 0);
  const receitasThisMonth = receitasDoMes(monthKey(todayStr()), null);
  const items = [
    { label: 'Em aberto', value: openTotal, color: 'var(--ink)' },
    { label: 'Vencido', value: overdueTotal, color: 'var(--brick)', sub: `${overdue.length} conta${overdue.length !== 1 ? 's' : ''}` },
    { label: 'Pago este mês', value: paidThisMonth, color: 'var(--teal)' },
    { label: 'Receitas este mês', value: receitasThisMonth, color: 'var(--teal)' },
  ];
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px;">
    ${items.map(it => `
      <div class="card" style="padding:16px 18px;">
        <div style="font-size:13px;font-weight:600;color:var(--ink-soft);">${it.label}</div>
        <div class="num" style="font-size:22px;font-weight:600;margin-top:6px;color:${it.color};">${formatCurrency(it.value)}</div>
        ${it.sub ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${it.sub}</div>` : ''}
      </div>
    `).join('')}
  </div>`;
}

/* ---------------------------------- painel ---------------------------------- */

function resumoCard(title, receitas, despesas, extraHtml) {
  const saldo = receitas - despesas;
  return `
   <div class="card" style="padding:16px 18px;">
     <div style="font-weight:700;font-size:14px;margin-bottom:10px;">${escapeHtml(title)}</div>
     <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);"><span>Receitas do mês</span><span class="num" style="color:var(--teal);font-weight:600;">+${formatCurrency(receitas)}</span></div>
     <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:4px;"><span>Despesas pagas</span><span class="num" style="color:var(--brick);font-weight:600;">-${formatCurrency(despesas)}</span></div>
     <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;">
       <span style="font-weight:700;font-size:13.5px;">Saldo do mês</span>
       <span class="num" style="font-weight:700;font-size:15px;color:${saldo >= 0 ? 'var(--teal)' : 'var(--brick)'};">${formatCurrency(saldo)}</span>
     </div>
     ${extraHtml || ''}
   </div>`;
}

function monthNav() {
  return `
    <div style="display:flex;align-items:center;gap:6px;">
      <button class="btn btn-ghost" style="padding:6px 10px;" onclick="changeMes(-1)" aria-label="Mês anterior">←</button>
      <div class="disp" style="font-weight:700;font-size:13.5px;min-width:130px;text-align:center;text-transform:capitalize;">${monthLabelFull(state.mesAtual)}</div>
      <button class="btn btn-ghost" style="padding:6px 10px;" onclick="changeMes(1)" aria-label="Próximo mês">→</button>
      ${state.mesAtual !== monthKey(todayStr()) ? `<button class="btn btn-ghost" style="padding:6px 10px;font-size:12px;" onclick="goToCurrentMonth()">hoje</button>` : ''}
    </div>
  `;
}
function changeMes(delta) { state.mesAtual = shiftMonth(state.mesAtual, delta); render(); }
function goToCurrentMonth() { state.mesAtual = monthKey(todayStr()); render(); }

function receitasOrigemList(mesKey, name) {
  const list = state.receitas.filter(r => r.pessoa === name && monthKey(r.data) === mesKey).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  if (list.length === 0) return `<p style="font-size:12px;color:var(--ink-soft);margin-top:10px;">Nenhuma receita nesse mês.</p>`;
  return `<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">` + list.map(r => `
    <div style="display:flex;justify-content:space-between;font-size:12.5px;gap:8px;">
      <span style="color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.origem || r.descricao)} · ${formatDate(r.data)}</span>
      <span class="num" style="font-weight:600;flex-shrink:0;">${formatCurrency(r.valor)}</span>
    </div>
  `).join('') + `</div>`;
}

function buildResumoSection() {
  const geralR = receitasDoMes(state.mesAtual, null), geralD = despesasPagasDoMes(state.mesAtual, null);
  const individuais = state.settings.names.map(n => resumoCard(n, receitasDoMes(state.mesAtual, n), despesasPagasDoMes(state.mesAtual, n), receitasOrigemList(state.mesAtual, n))).join('');
  return `
    <div class="card" style="padding:18px 20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <h3 class="disp" style="font-size:15px;font-weight:700;margin:0;">Resumo do mês</h3>
        ${monthNav()}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
        ${resumoCard('Geral (os dois)', geralR, geralD)}
        ${individuais}
      </div>
    </div>
  `;
}

function buildPainel() {
  const catData = categoryChartData(state.mesAtual);
  const attention = [...overdueList(), ...dueSoonList()];
  return `
    <div style="display:flex;flex-direction:column;gap:20px;">
      ${buildResumoSection()}
      <div class="card" style="padding:18px 20px;">
        <h3 class="disp" style="font-size:15px;font-weight:700;margin:0 0 14px;text-transform:capitalize;">Despesas por categoria — ${monthLabelFull(state.mesAtual)}</h3>
        ${catData.length === 0 ? `<p style="color:var(--ink-soft);font-size:14px;">Nenhum lançamento vencendo nesse mês.</p>` : svgBarChart(catData)}
      </div>
      ${attention.length > 0 ? `
        <div class="card" style="padding:18px 20px;">
          <h3 class="disp" style="font-size:15px;font-weight:700;margin:0 0 12px;">Precisa de atenção</h3>
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${attention.map(e => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);">
                <div>
                  <div style="font-weight:600;font-size:14px;">${escapeHtml(e.descricao)}</div>
                  <div style="font-size:12.5px;color:var(--ink-soft);">vence ${formatDate(e.vencimento)} · ${(CATEGORY_MAP[e.categoria] || {}).label || ''}</div>
                </div>
                <div style="text-align:right;">
                  <div class="num" style="font-weight:600;">${formatCurrency(e.valor)}</div>
                  ${e.status === 'vencido' ? `<span class="pill pill-vencido">${e.diasVencido}d vencido</span>` : `<span class="pill pill-proximo">vence em ${Math.max(0, -e.diasVencido)}d</span>`}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : `<div class="card" style="padding:18px 20px;text-align:center;color:var(--ink-soft);">Tudo em dia — nenhuma conta vencida ou vencendo nos próximos dias. 🎉</div>`}
    </div>
  `;
}

/* ---------------------------------- lançar ---------------------------------- */

function buildLancar() {
  return `
    <div class="card" style="padding:20px;">
      <div style="display:flex;gap:6px;margin-bottom:16px;">
        <div class="qrtab ${state.lancarSub === 'despesa' ? 'active' : ''}" onclick="setLancarSub('despesa')">Despesa</div>
        <div class="qrtab ${state.lancarSub === 'receita' ? 'active' : ''}" onclick="setLancarSub('receita')">Receita</div>
      </div>
      ${state.lancarSub === 'despesa' ? buildFormDespesa() : buildFormReceita()}
    </div>
  `;
}

function buildFormDespesa() {
  const catOptions = CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button class="btn btn-ghost" onclick="openQRModal()">📷 Ler nota (QR/IA)</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div><label class="label">Descrição</label><input class="input" id="descDespesa" placeholder="Ex: Conta de luz, mercado, escola…"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label class="label">Valor</label><input class="input" type="number" step="0.01" min="0" id="valorDespesa" placeholder="0,00"></div>
        <div><label class="label">Vencimento</label><input class="input" type="date" id="vencDespesa" value="${todayStr()}"></div>
      </div>
      <div><label class="label">Categoria</label><select class="input" id="catDespesa">${catOptions}</select></div>
      <div><label class="label">Observação (opcional)</label><input class="input" id="obsDespesa" placeholder="Fornecedor, nº da nota, detalhes…"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;"><input type="checkbox" id="pagoDespesa" style="width:16px;height:16px;"> Já foi paga</label>
      <button class="btn btn-primary" style="justify-content:center;margin-top:4px;" onclick="submitDespesa()">+ Lançar despesa</button>
    </div>
  `;
}

async function submitDespesa() {
  const descricao = document.getElementById('descDespesa').value.trim();
  const valor = Number(document.getElementById('valorDespesa').value);
  const vencimento = document.getElementById('vencDespesa').value;
  const categoria = document.getElementById('catDespesa').value;
  const observacao = document.getElementById('obsDespesa').value.trim();
  const pago = document.getElementById('pagoDespesa').checked;
  if (!descricao || !valor || !vencimento) { showToast('Preencha descrição, valor e vencimento.'); return; }
  const item = {
    id: uid(), descricao, valor, categoria, vencimento, observacao,
    pago, dataPagamento: pago ? todayStr() : null,
    lancadoPor: state.settings.names[state.currentUser], criadoEm: new Date().toISOString(),
  };
  state.despesas = [item, ...state.despesas];
  await saveDespesas();
  showToast('Despesa lançada.');
  render();
}

function buildFormReceita() {
  const typeOptions = INCOME_TYPES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  const peopleOptions = state.settings.names.map((n, i) => `<option value="${escapeAttr(n)}" ${i === state.currentUser ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');
  return `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div><label class="label">Descrição</label><input class="input" id="descReceita" placeholder="Ex: Salário, freela, reembolso…"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label class="label">Valor</label><input class="input" type="number" step="0.01" min="0" id="valorReceita" placeholder="0,00"></div>
        <div><label class="label">Data</label><input class="input" type="date" id="dataReceita" value="${todayStr()}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label class="label">De quem é</label><select class="input" id="pessoaReceita">${peopleOptions}</select></div>
        <div><label class="label">Tipo</label><select class="input" id="tipoReceita">${typeOptions}</select></div>
      </div>
      <div><label class="label">De onde veio</label><input class="input" id="origemReceita" placeholder="Ex: Salário BMA, cliente X, aluguel recebido…"></div>
      <button class="btn btn-teal" style="justify-content:center;margin-top:4px;" onclick="submitReceita()">+ Lançar receita</button>
    </div>
  `;
}

async function submitReceita() {
  const descricao = document.getElementById('descReceita').value.trim();
  const valor = Number(document.getElementById('valorReceita').value);
  const data = document.getElementById('dataReceita').value;
  const pessoa = document.getElementById('pessoaReceita').value;
  const tipo = document.getElementById('tipoReceita').value;
  const origem = document.getElementById('origemReceita').value.trim();
  if (!descricao || !valor || !data) { showToast('Preencha descrição, valor e data.'); return; }
  const item = { id: uid(), descricao, valor, data, pessoa, tipo, origem, criadoEm: new Date().toISOString() };
  state.receitas = [item, ...state.receitas];
  await saveReceitas();
  showToast('Receita lançada.');
  render();
}

/* ---------------------------------- lista de despesas ---------------------------------- */

function buildDespesasList() {
  const list = enrichDespesas().filter(e => {
    if (filterDespStatus === 'pendentes' && e.pago) return false;
    if (filterDespStatus === 'pagas' && !e.pago) return false;
    if (filterDespStatus === 'vencidas' && e.status !== 'vencido') return false;
    if (filterDespCat !== 'todas' && e.categoria !== filterDespCat) return false;
    if (filterDespMes !== 'todos' && monthKey(e.vencimento) !== filterDespMes) return false;
    return true;
  }).sort((a, b) => (a.vencimento < b.vencimento ? 1 : -1));

  const filterBtns = ['todas', 'pendentes', 'pagas', 'vencidas'].map(f => `
    <button class="tab-btn" style="font-size:12.5px;padding:7px 12px;" onclick="setFilterDespStatus('${f}')">
      <span style="opacity:${filterDespStatus === f ? 1 : 0.55};font-weight:${filterDespStatus === f ? 800 : 600};">${f[0].toUpperCase() + f.slice(1)}</span>
    </button>`).join('');
  const catOptions = `<option value="todas">Todas categorias</option>` + CATEGORIES.map(c => `<option value="${c.id}" ${filterDespCat === c.id ? 'selected' : ''}>${c.label}</option>`).join('');
  const meses = distinctMonths(state.despesas, 'vencimento');
  const mesOptions = `<option value="todos">Todos os meses</option>` + meses.map(m => `<option value="${m}" ${filterDespMes === m ? 'selected' : ''}>${monthLabelFull(m)}</option>`).join('');

  const rows = list.length === 0
    ? `<div class="card" style="padding:30px;text-align:center;color:var(--ink-soft);">Nenhuma conta nesse filtro.</div>`
    : filterDespMes === 'todos' ? groupByMonth(list, 'vencimento', despesaRow) : list.map(e => despesaRow(e)).join('');

  return `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      ${filterBtns}
      <select class="input" style="width:auto;font-size:12.5px;padding:7px 10px;" onchange="setFilterDespCat(this.value)">${catOptions}</select>
      <select class="input" style="width:auto;font-size:12.5px;padding:7px 10px;" onchange="setFilterDespMes(this.value)">${mesOptions}</select>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">${rows}</div>
  `;
}
function setFilterDespStatus(f) { filterDespStatus = f; render(); }
function setFilterDespCat(c) { filterDespCat = c; render(); }
function setFilterDespMes(m) { filterDespMes = m; render(); }

function groupByMonth(list, field, rowFn) {
  let html = ''; let lastMonth = null;
  list.forEach(item => {
    const mk = monthKey(item[field]);
    if (mk !== lastMonth) {
      html += `<div class="disp" style="font-weight:700;font-size:13px;color:var(--ink-soft);text-transform:capitalize;">${monthLabelFull(mk)}</div>`;
      lastMonth = mk;
    }
    html += rowFn(item);
  });
  return html;
}


function despesaRow(e) {
  const cat = CATEGORY_MAP[e.categoria] || CATEGORY_MAP.outros;
  const confirming = state.confirmDelete && state.confirmDelete.type === 'despesa' && state.confirmDelete.id === e.id;
  let statusPill;
  if (e.pago) statusPill = `<span class="pill pill-pago">pago ${formatDate(e.dataPagamento)}</span>`;
  else if (e.status === 'vencido') statusPill = `<span class="pill pill-vencido">${e.diasVencido}d vencido</span>`;
  else if (e.status === 'proximo') statusPill = `<span class="pill pill-proximo">vence em ${Math.max(0, -e.diasVencido)}d</span>`;
  else statusPill = `<span class="pill pill-pendente">em aberto</span>`;
  return `
    <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div class="checkbox ${e.pago ? 'checked' : ''}" onclick="togglePaid('${e.id}')" role="button" aria-label="Marcar como paga">${e.pago ? '✓' : ''}</div>
      <div style="flex:1;min-width:160px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-weight:600;font-size:14px;text-decoration:${e.pago ? 'line-through' : 'none'};color:${e.pago ? 'var(--ink-soft)' : 'var(--ink)'};">${escapeHtml(e.descricao)}</span>
          <span style="width:6px;height:6px;border-radius:999px;background:${cat.color};flex-shrink:0;"></span>
          <span style="font-size:12px;color:var(--ink-soft);">${cat.label}</span>
        </div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">vence ${formatDate(e.vencimento)} · lançado por ${escapeHtml(e.lancadoPor)}${e.observacao ? ' · ' + escapeHtml(e.observacao) : ''}</div>
      </div>
      <div style="text-align:right;">
        <div class="num" style="font-weight:600;font-size:14.5px;">${formatCurrency(e.valor)}</div>
        ${statusPill}
      </div>
      ${confirming ? `
        <div style="display:flex;gap:4px;">
          <button class="btn" style="padding:6px 10px;background:var(--brick);color:#fff;font-size:12px;" onclick="deleteDespesa('${e.id}')">Excluir</button>
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px;" onclick="cancelDelete()">Cancelar</button>
        </div>
      ` : `<button class="btn btn-ghost" style="padding:8px;" onclick="askDeleteDespesa('${e.id}')" aria-label="Excluir">🗑</button>`}
    </div>
  `;
}
function askDeleteDespesa(id) { state.confirmDelete = { type: 'despesa', id }; render(); }
function cancelDelete() { state.confirmDelete = null; render(); }
async function deleteDespesa(id) {
  state.despesas = state.despesas.filter(d => d.id !== id);
  state.confirmDelete = null;
  await saveDespesas();
  showToast('Despesa excluída.');
  render();
}
async function togglePaid(id) {
  state.despesas = state.despesas.map(d => d.id === id ? { ...d, pago: !d.pago, dataPagamento: !d.pago ? todayStr() : null } : d);
  await saveDespesas();
  render();
}

/* ---------------------------------- lista de receitas ---------------------------------- */

function buildReceitasList() {
  const list = state.receitas.filter(r => {
    if (filterReceitaPessoa !== 'todas' && r.pessoa !== filterReceitaPessoa) return false;
    if (filterReceitaTipo !== 'todas' && r.tipo !== filterReceitaTipo) return false;
    if (filterReceitaMes !== 'todos' && monthKey(r.data) !== filterReceitaMes) return false;
    return true;
  }).sort((a, b) => (b.data || '').localeCompare(a.data || ''));

  const pessoaOptions = `<option value="todas">Todos</option>` + state.settings.names.map(n => `<option value="${escapeAttr(n)}" ${filterReceitaPessoa === n ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');
  const tipoOptions = `<option value="todas">Todos os tipos</option>` + INCOME_TYPES.map(t => `<option value="${t.id}" ${filterReceitaTipo === t.id ? 'selected' : ''}>${t.label}</option>`).join('');
  const meses = distinctMonths(state.receitas, 'data');
  const mesOptions = `<option value="todos">Todos os meses</option>` + meses.map(m => `<option value="${m}" ${filterReceitaMes === m ? 'selected' : ''}>${monthLabelFull(m)}</option>`).join('');

  const rows = list.length === 0
    ? `<div class="card" style="padding:30px;text-align:center;color:var(--ink-soft);">Nenhuma receita nesse filtro.</div>`
    : filterReceitaMes === 'todos' ? groupByMonth(list, 'data', receitaRow) : list.map(r => receitaRow(r)).join('');

  return `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <select class="input" style="width:auto;font-size:12.5px;padding:7px 10px;" onchange="setFilterReceitaPessoa(this.value)">${pessoaOptions}</select>
      <select class="input" style="width:auto;font-size:12.5px;padding:7px 10px;" onchange="setFilterReceitaTipo(this.value)">${tipoOptions}</select>
      <select class="input" style="width:auto;font-size:12.5px;padding:7px 10px;" onchange="setFilterReceitaMes(this.value)">${mesOptions}</select>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">${rows}</div>
  `;
}
function setFilterReceitaPessoa(v) { filterReceitaPessoa = v; render(); }
function setFilterReceitaTipo(v) { filterReceitaTipo = v; render(); }
function setFilterReceitaMes(v) { filterReceitaMes = v; render(); }

function receitaRow(r) {
  const tipo = INCOME_TYPE_MAP[r.tipo] || INCOME_TYPES[INCOME_TYPES.length - 1];
  const confirming = state.confirmDelete && state.confirmDelete.type === 'receita' && state.confirmDelete.id === r.id;
  return `
    <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div style="width:34px;height:34px;border-radius:999px;background:${tipo.color}22;display:flex;align-items:center;justify-content:center;color:${tipo.color};font-weight:700;font-size:13px;flex-shrink:0;">${escapeHtml((r.pessoa || '?')[0])}</div>
      <div style="flex:1;min-width:160px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-weight:600;font-size:14px;">${escapeHtml(r.descricao)}</span>
          <span style="font-size:12px;color:var(--ink-soft);">${tipo.label}</span>
        </div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">${formatDate(r.data)} · ${escapeHtml(r.pessoa)}${r.origem ? ' · ' + escapeHtml(r.origem) : ''}</div>
      </div>
      <div class="num" style="font-weight:600;font-size:14.5px;color:var(--teal);">+${formatCurrency(r.valor)}</div>
      ${confirming ? `
        <div style="display:flex;gap:4px;">
          <button class="btn" style="padding:6px 10px;background:var(--brick);color:#fff;font-size:12px;" onclick="deleteReceita('${r.id}')">Excluir</button>
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px;" onclick="cancelDelete()">Cancelar</button>
        </div>
      ` : `<button class="btn btn-ghost" style="padding:8px;" onclick="askDeleteReceita('${r.id}')" aria-label="Excluir">🗑</button>`}
    </div>
  `;
}
function askDeleteReceita(id) { state.confirmDelete = { type: 'receita', id }; render(); }
async function deleteReceita(id) {
  state.receitas = state.receitas.filter(r => r.id !== id);
  state.confirmDelete = null;
  await saveReceitas();
  showToast('Receita excluída.');
  render();
}

/* ---------------------------------- toast ---------------------------------- */

function showToast(msg) {
  let el = document.getElementById('toastEl');
  if (!el) { el = document.createElement('div'); el.id = 'toastEl'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

/* ---------------------------------- configurações (modal independente) ---------------------------------- */

function openSettingsModal() {
  const html = `
    <div class="modal-overlay" id="settingsOverlay">
      <div class="modal-box" style="max-width:400px;" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h3 class="disp" style="font-size:16px;font-weight:700;margin:0;">Configurações</h3>
          <button class="btn btn-ghost" style="padding:6px;" onclick="closeSettingsModal()">✕</button>
        </div>
        <label class="label">Nome de vocês dois</label>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
          <input class="input" id="settName0" value="${escapeAttr(state.settings.names[0])}">
          <input class="input" id="settName1" value="${escapeAttr(state.settings.names[1])}">
        </div>
        <label class="label">Chave da API da Groq (leitura de nota por foto com IA)</label>
        <input class="input" id="settGroqKey" type="password" value="${escapeAttr(groqKey)}" placeholder="gsk_...">
        <p style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0;">Gere grátis em console.groq.com/keys. Fica salva só neste navegador — não é compartilhada com ninguém.</p>
        <p style="font-size:12px;color:var(--ink-soft);margin:14px 0;">Os lançamentos de despesas e receitas ficam compartilhados entre vocês dois neste app.</p>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="saveSettingsModal()">Salvar</button>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('settingsOverlay').addEventListener('click', closeSettingsModal);
}
function closeSettingsModal() { const el = document.getElementById('settingsOverlay'); if (el) el.remove(); }
async function saveSettingsModal() {
  const n0 = document.getElementById('settName0').value.trim() || 'Fernanda';
  const n1 = document.getElementById('settName1').value.trim() || 'Marido';
  const key = document.getElementById('settGroqKey').value.trim();
  state.settings = { names: [n0, n1] };
  groqKey = key;
  await saveSettings();
  try { localStorage.setItem('gastos_groq_key', groqKey); } catch (e) { /* navegador sem localStorage */ }
  closeSettingsModal();
  render();
  showToast('Configurações salvas.');
}

/* ---------------------------------- modal de leitura de nota ---------------------------------- */

let qrCurrentMode = 'foto';

function openQRModal() {
  const html = `
    <div class="modal-overlay" id="qrOverlay">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h3 class="disp" style="font-size:16px;font-weight:700;margin:0;">Ler nota fiscal</h3>
          <button class="btn btn-ghost" style="padding:6px;" onclick="closeQRModal()">✕</button>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:14px;" id="qrTabs">
          <div class="qrtab active" data-qrmode="foto" onclick="setQRMode('foto')">📷 Foto (IA)</div>
          <div class="qrtab" data-qrmode="qr" onclick="setQRMode('qr')">▦ QR Code</div>
          <div class="qrtab" data-qrmode="colar" onclick="setQRMode('colar')">⌨ Colar</div>
        </div>
        <div id="qrModeBody"></div>
        <div id="qrResultBody"></div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('qrOverlay').addEventListener('click', closeQRModal);
  setQRMode('foto');
}
function closeQRModal() {
  stopCamera();
  const el = document.getElementById('qrOverlay');
  if (el) el.remove();
}
function setQRMode(mode) {
  qrCurrentMode = mode;
  stopCamera();
  document.querySelectorAll('#qrTabs .qrtab').forEach(t => t.classList.toggle('active', t.dataset.qrmode === mode));
  const body = document.getElementById('qrModeBody');
  document.getElementById('qrResultBody').innerHTML = '';
  if (mode === 'foto') {
    body.innerHTML = `
      ${!groqKey ? `<p style="font-size:13px;color:var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:8px;margin-bottom:10px;">Configure sua chave da Groq em Configurações para ler a nota inteira com IA (inclusive o valor). <button class="btn btn-ghost" style="padding:4px 8px;font-size:12px;" onclick="closeQRModal();openSettingsModal();">Configurar agora</button></p>` : ''}
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="startCamera('foto')">📷 Usar câmera</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="document.getElementById('qrFileInput').click()">⬆ Enviar foto</button>
      </div>
      <input type="file" id="qrFileInput" accept="image/*" style="display:none" onchange="handleQRFile(event,'foto')">
      <div id="qrCameraArea" style="margin-top:10px;"></div>
    `;
  } else if (mode === 'qr') {
    body.innerHTML = `
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="startCamera('qr')">📷 Usar câmera</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="document.getElementById('qrFileInput2').click()">⬆ Enviar imagem</button>
      </div>
      <input type="file" id="qrFileInput2" accept="image/*" style="display:none" onchange="handleQRFile(event,'qr')">
      <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Sem IA: identifica o estabelecimento pela chave de acesso, mas não traz o valor.</p>
      <div id="qrCameraArea" style="margin-top:10px;"></div>
    `;
  } else {
    body.innerHTML = `
      <label class="label">Cole aqui o link/texto do QR Code (ou a chave de acesso de 44 números)</label>
      <textarea class="input" id="qrPasteText" rows="3" placeholder="https://www.fazenda.sp.gov.br/nfce/qrcode?p=..."></textarea>
      <button class="btn btn-primary" style="margin-top:10px;width:100%;justify-content:center;" onclick="processQRText(document.getElementById('qrPasteText').value)">Buscar dados</button>
    `;
  }
}

function stopCamera() {
  if (scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}

async function startCamera(mode) {
  const area = document.getElementById('qrCameraArea');
  if (!area) return;
  area.innerHTML = `<video id="qrVideo" autoplay muted playsinline style="width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover;"></video><div id="qrCamMsg" style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;"></div>`;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('qrVideo');
    video.srcObject = mediaStream;
    await video.play();
    if (mode === 'foto') {
      document.getElementById('qrCamMsg').innerHTML = `<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" onclick="captureFotoFrame()">Tirar foto e analisar</button>`;
    } else {
      document.getElementById('qrCamMsg').textContent = 'Aponte a câmera para o QR Code da nota…';
      scanQRLoop();
    }
  } catch (e) {
    area.innerHTML = `<p style="font-size:13px;color:var(--brick);">Não consegui acessar a câmera. Use "Enviar imagem"/"Enviar foto" no lugar.</p>`;
  }
}

function captureFotoFrame() {
  const video = document.getElementById('qrVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  stopCamera();
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  processFotoDataUrl(dataUrl);
}

async function scanQRLoop() {
  if (!('BarcodeDetector' in window)) {
    document.getElementById('qrCamMsg').innerHTML = 'Este navegador não suporta leitura automática de QR. Use "Colar texto".';
    stopCamera();
    return;
  }
  const video = document.getElementById('qrVideo');
  const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
  const loop = async () => {
    if (!mediaStream || !video) return;
    try {
      const codes = await detector.detect(video);
      if (codes.length > 0) { stopCamera(); processQRText(codes[0].rawValue); return; }
    } catch (e) { /* ignora frame */ }
    scanRAF = requestAnimationFrame(loop);
  };
  scanRAF = requestAnimationFrame(loop);
}

function handleQRFile(evt, mode) {
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    if (mode === 'foto') {
      processFotoDataUrl(dataUrl);
    } else {
      if (!('BarcodeDetector' in window)) {
        document.getElementById('qrResultBody').innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Este navegador não lê QR de imagem automaticamente. Use "Colar texto".</p>`;
        return;
      }
      try {
        const bitmap = await createImageBitmap(file);
        const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
        const codes = await detector.detect(bitmap);
        if (codes.length > 0) processQRText(codes[0].rawValue);
        else document.getElementById('qrResultBody').innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Não achei um QR Code nessa imagem.</p>`;
      } catch (e) {
        document.getElementById('qrResultBody').innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Não consegui ler essa imagem.</p>`;
      }
    }
  };
  reader.readAsDataURL(file);
}

async function callGroqVision(dataUrl) {
  if (!groqKey) return { error: 'no-key' };
  try {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + groqKey },
      body: JSON.stringify({
        model: GROQ_VISION_MODEL,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: 'Você está lendo uma nota fiscal, cupom fiscal ou recibo brasileiro. Responda APENAS um JSON válido, sem texto antes ou depois, no formato: {"fornecedor": "nome do estabelecimento ou null", "valor": numero_total_ou_null, "data": "AAAA-MM-DD ou null", "categoria": "uma dessas: moradia, alimentacao, transporte, saude, educacao, lazer, assinaturas, compras, outros", "ramo": "ramo de atividade em poucas palavras ou null"}. O campo valor deve ser o valor TOTAL da nota, em número com ponto decimal, sem símbolo de moeda.' },
            { type: 'image_url', image_url: { url: dataUrl } }
          ]
        }],
        temperature: 0.1,
        max_completion_tokens: 500,
        response_format: { type: 'json_object' }
      })
    });
    if (!resp.ok) { const txt = await resp.text(); return { error: 'http', detail: txt }; }
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '{}';
    return { ok: true, data: JSON.parse(content) };
  } catch (e) { return { error: 'network', detail: String(e) }; }
}

async function processFotoDataUrl(dataUrl) {
  const resBody = document.getElementById('qrResultBody');
  resBody.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink-soft);font-size:13.5px;">⏳ Lendo a nota com IA…</div>`;
  const result = await callGroqVision(dataUrl);
  if (result.error === 'no-key') {
    resBody.innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Configure sua chave da Groq em Configurações primeiro.</p>`;
    return;
  }
  if (result.error) {
    resBody.innerHTML = `<p style="font-size:13px;color:var(--brick);margin-top:10px;">Não consegui falar com a IA da Groq agora (${escapeHtml(String(result.detail || '').slice(0, 140))}). Tente de novo ou use "QR Code"/"Colar texto".</p>`;
    return;
  }
  const d = result.data || {};
  const categoria = CATEGORY_MAP[d.categoria] ? d.categoria : mapCategoria(d.ramo || '');
  showQRResult({
    fornecedor: d.fornecedor || '', valor: (d.valor !== undefined && d.valor !== null) ? Number(d.valor) : null,
    data: d.data || null, categoria, ramo: d.ramo || '',
    info: `Lido por IA${d.ramo ? ' · ' + d.ramo : ''}`,
  });
}

async function processQRText(text) {
  const resBody = document.getElementById('qrResultBody');
  const chave = extractChave(text);
  if (!chave) {
    resBody.innerHTML = `<p style="font-size:13.5px;color:var(--brick);margin-top:14px;">Não encontrei uma chave de acesso válida nesse conteúdo. Tente colar o link completo que fica embaixo do QR.</p>`;
    return;
  }
  const { cnpj, numeroNF, emissao } = parseChave(chave);
  resBody.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink-soft);font-size:13.5px;">⏳ Identificando o estabelecimento…</div>`;
  let fornecedor = '', ramo = '';
  try {
    const resp = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
    if (resp.ok) {
      const data = await resp.json();
      fornecedor = data.nome_fantasia || data.razao_social || '';
      ramo = data.cnae_fiscal_descricao || '';
    }
  } catch (e) { /* segue sem dados do CNPJ */ }
  const categoria = mapCategoria(ramo);
  showQRResult({ fornecedor, valor: null, data: null, categoria, ramo, info: `Nota ${numeroNF} · ${emissao}${ramo ? ' · ' + ramo : ''}` });
}

function showQRResult(r) {
  window.__qrPrefillCandidate = r;
  const resBody = document.getElementById('qrResultBody');
  const cat = CATEGORY_MAP[r.categoria] || CATEGORY_MAP.outros;
  resBody.innerHTML = `
    <div class="card" style="padding:14px;margin-top:14px;background:var(--bg);">
      ${r.fornecedor ? `<div style="font-weight:700;font-size:15px;">${escapeHtml(r.fornecedor)}</div>` : `<p style="font-size:13.5px;color:var(--ink-soft);">Não identifiquei o estabelecimento automaticamente — dá pra preencher na mão.</p>`}
      ${r.ramo ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">${escapeHtml(r.ramo)}</div>` : ''}
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
        <span class="pill" style="background:${cat.color}22;color:${cat.color};">sugestão: ${cat.label}</span>
        ${r.valor != null ? `<span class="pill pill-pago">valor lido: ${formatCurrency(r.valor)}</span>` : ''}
        ${r.data ? `<span class="pill pill-pendente">${formatDate(r.data)}</span>` : ''}
      </div>
      ${r.valor == null ? `<p style="font-size:12px;color:var(--ink-soft);margin-top:10px;">Esse método não traz o valor da compra — preencha na próxima tela. (Use "Foto (IA)" pra tentar puxar o valor também.)</p>` : ''}
      <button class="btn btn-primary" style="margin-top:10px;width:100%;justify-content:center;" onclick="usePrefillFromQR()">Usar estes dados no lançamento →</button>
    </div>
  `;
}

function usePrefillFromQR() {
  const r = window.__qrPrefillCandidate;
  closeQRModal();
  state.tab = 'lancar'; state.lancarSub = 'despesa';
  render();
  setTimeout(() => {
    const descEl = document.getElementById('descDespesa');
    const catEl = document.getElementById('catDespesa');
    const valorEl = document.getElementById('valorDespesa');
    const obsEl = document.getElementById('obsDespesa');
    const vencEl = document.getElementById('vencDespesa');
    const pagoEl = document.getElementById('pagoDespesa');
    if (descEl) descEl.value = r.fornecedor || '';
    if (catEl) catEl.value = r.categoria || 'outros';
    if (obsEl) obsEl.value = r.info || '';
    if (r.valor != null && valorEl) valorEl.value = r.valor;
    if (r.data && vencEl) vencEl.value = r.data;
    if (r.data && pagoEl) pagoEl.checked = true;
    if (valorEl) valorEl.focus();
  }, 30);
}

/* ---------------------------------- start ---------------------------------- */

init();
</script>
</body>
</html>
